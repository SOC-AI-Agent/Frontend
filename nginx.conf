server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # There used to be a location here proxying /llm/ to soc-llm-server, for
    # reading one agent run's trace (JobEvidence.jsx). The agent platform is
    # now Agent-Server (../Agent-Server) — not on soc-network, so nothing at a
    # fixed container name to proxy_pass to (nginx fails to start against a
    # hostname it cannot resolve) — and its response carries no run id to read
    # a trace back by anyway. JobEvidence.jsx already guards on agent_run_id
    # being set, so it degrades to showing everything except the trace rather
    # than breaking.

    location ~ ^/(auth|v1|admin|health|docs|redoc|openapi.json) {
        proxy_pass http://soc-core-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
