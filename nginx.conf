server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The agent run trace lives on the LLM server, not the core backend. Proxied
    # here so the dashboard stays on one origin — the browser never learns there
    # is a second service, and there is no CORS to configure.
    location /llm/ {
        proxy_pass http://soc-llm-server:8400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx gives up after 60s by default, which is shorter than a single
        # CPU-only agent run. Reading a stored trace is fast, but anything that
        # runs a model through here would be cut off mid-answer and look like
        # the LLM server had died.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location ~ ^/(auth|v1|admin|health|docs|redoc|openapi.json) {
        proxy_pass http://soc-core-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
