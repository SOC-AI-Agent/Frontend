# Frontend — the analyst dashboard.
#
# No .env and nothing secret. The npm proxy is set in the Dockerfile; the
# deploy job's environment can carry BACKEND_HOST / BACKEND_PORT as CI
# variables (the API nginx proxies to, default soc-core-api:8000).

stages:
  - build
  - test
  - deploy


build_image:
  stage: build
  image: docker:latest
  tags:
    - test
  # A shared runner has no Docker daemon of its own, so one is started
  # alongside. The deploy job does the opposite — it wants the daemon of the
  # host it is deploying to — which is why this is set per job rather than
  # once at the top.
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    # Proxy off: the Dockerfile's npm proxy is on the office network, which a
    # gitlab.com shared runner can't reach. The deploy job builds on the
    # office machine and keeps it.
    - docker build --build-arg NPM_PROXY= -t soc-frontend:${CI_COMMIT_SHORT_SHA} .
  rules:
    - if: '$CI_COMMIT_BRANCH'

code_test:
  stage: test
  image: node:20
  tags:
    - test
  script:
    - npm ci
    # A build failure here is a blank dashboard in production, and it is the
    # only check that catches a bad import before then.
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_production:
  stage: deploy
  image: docker:latest
  # The only job that needs a specific runner. DOCKER_HOST points at the
  # socket of the machine this runs on, so the runner *is* the deployment
  # target — a shared runner would build the stack inside a throwaway
  # container and take it away again.
  tags:
    # `llm` is the production runner: the one installed on the machine that
    # hosts the stack, so the runner IS the deployment target. Build and test
    # jobs run on `test`; the same runner carries both tags today.
    - llm
  variables:
    # The socket of the machine this runner is on: the deployment target.
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: production
    # The address GitLab shows and links to. It is where the service actually
    # answers, so it comes from a variable — localhost here would be a link to
    # the runner, which is not where anyone reads this from.
    url: '$FRONTEND_URL'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "========== Build and start =========="
    # soc-network is external (see docker-compose.yml) — shared with
    # AI-service/Backend/MCP-Server's deploys, all on this same production
    # runner/host. Whichever of the four deploys first, creates it; idempotent
    # so the other three deploying in any order or any number of times is fine.
    - docker network create soc-network 2>/dev/null || true
    - docker compose up -d --build --wait
    - echo "========== Serving =========="
    - |
      for i in $(seq 1 20); do
        if docker compose exec -T soc-frontend wget -q -O /dev/null http://localhost/ 2>/dev/null; then
          echo "serving"; exit 0
        fi
        sleep 3
      done
      echo "the dashboard did not start"; docker compose logs --tail 40 soc-frontend; exit 1
