# Dependabot opens PRs when a dependency gets a security advisory or a new
# release. Security updates are opened regardless of the schedule below.
#
# `cooldown` holds a version back until it has survived a week in the registry,
# so a hijacked publish is unpublished before it can reach a PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
