# The analyst dashboard.
#
#   docker compose up -d --build     # http://localhost:3001
#
# nginx proxies /auth, /v1, /admin and /health to soc-core-api, so the browser
# stays on one origin and there is no CORS to configure. It must be reachable
# on soc-network or those paths 502. (There used to also be a /llm proxy to
# soc-llm-server, for the agent run trace — see nginx.conf.)

services:
  soc-frontend:
    build: .
    container_name: soc-frontend
    ports: ["3001:80"]
    restart: unless-stopped
    networks: [soc-network]

networks:
  soc-network:
    name: soc-network
    driver: bridge
